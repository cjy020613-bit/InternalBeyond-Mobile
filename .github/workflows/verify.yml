name: Verify IB + Codex Provider

on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gateway dependencies
        run: python -m pip install -r gateway/requirements.txt
      - name: Check JavaScript syntax
        run: |
          node --check custom/ib-codex-provider.js
          node --check apps/catalog.js
          node --check apps/ib-app-cinema.js
          node --check ib-sw.js
      - name: Check Python syntax and Codex SDK
        run: |
          python -m py_compile gateway/app.py gateway/codex_bridge.py gateway/ob_client.py gateway/ob_startup_probe.py gateway/store.py
          python -c "from openai_codex import AsyncCodex, Sandbox; assert AsyncCodex and Sandbox"
          python -c "from mcp import ClientSession; from mcp.client import streamable_http; assert ClientSession and streamable_http"
      - name: Check stock IB + native subscription integration
        run: |
          node scripts/check.mjs
          node scripts/check-inline.mjs
          node scripts/check-native-provider.mjs
      - name: Check gateway core
        run: |
          cd gateway
          python -m unittest test_gateway_core.py
